<body>

<div class="hero">
    <main>
  
       
<ul class="app-link-list">

  </li>
</ul>


    </main>
</div>

<script>
function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}



function velgKategori(kategori) {

    const TOTAL = {
        Kap1: 50, Kap2: 70, Kap3: 32, Kap4: 33
    };

    // Nullstill resultatene når et nytt emne startes.
    const storageKey = `quizData_${kategori}`;
    localStorage.removeItem(storageKey);
    sessionStorage.removeItem("harStartet");

    // Bruk ALLE oppgavene i kronologisk rekkefølge:
    // Oppgave1.html, Oppgave2.html, Oppgave3.html, ...
    const alleOppgaver = [];
    for (let i = 1; i <= (TOTAL[kategori] || 1); i++) {
        alleOppgaver.push(i);
    }

    sessionStorage.setItem("valgtKategori", kategori);
    sessionStorage.setItem("aktivtOppgavesett", JSON.stringify(alleOppgaver));
}
</script>
